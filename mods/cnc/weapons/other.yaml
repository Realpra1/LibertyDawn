	Projectile: GravityBomb
		Image: BOMBLET
		Shadow: true
	Warhead@1Dam: SpreadDamage
		Spread: 341
		Damage: 3000
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		Versus:
			None: 100
			Wood: 80
			TiberiumWood: 80
			Light: 50
			Tiberium: 10
			Heavy: 10
	Warhead@1Eff: CreateEffect
		Explosions: med_napalm
    Warhead@1Res_area: DestroyResource
		Size: 1
		Delay: 1

