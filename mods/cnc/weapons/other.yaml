^FlameWeapon:
	ValidTargets: Ground, Water, Trees
	ReloadDelay: 55
	Range: 3c0
	InvalidTargets: Wall
	Report: flamer2.aud
	Projectile: Bullet
		Speed: 1c682
	Warhead@1Dam: SpreadDamage
		Spread: 500
		Damage: 786
		ValidTargets: Ground, Water, Trees
		InvalidTargets: Wall
		Versus:
			None: 90
			Wood: 120
            TiberiumWood: 100
			Light: 80
			Tiberium: 20
			Heavy: 20
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@1Smu: LeaveSmudge
		SmudgeType: Scorch
		InvalidTargets: Vehicle, Structure, Wall
	Warhead@1Eff: CreateEffect
		Explosions: small_napalm
		ImpactActors: false
    
Flamethrower:
    Inherits@FlameWeapon: ^FlameWeapon
	Inherits@FlamethrowerExplode: ^FlamethrowerExplode

