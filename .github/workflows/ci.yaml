name: Continuous Integration

on:
  push:
  pull_request:
    branches:
      - bleed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (.NET 6.0)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Check Code
        run: make check

      - name: Check Scripts
        run: make check-scripts

      - name: Check Mods
        run: make test

      - name: Run Unit Tests
        run: >-
          dotnet test OpenRA.Test/OpenRA.Test.csproj
          --configuration Debug
          --nologo
          -p:TargetPlatform=linux-x64

  windows:
    name: Windows (.NET 6.0)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Install Lua 5.1
        shell: pwsh
        run: |
          $luaInstaller = Join-Path $env:RUNNER_TEMP "LuaForWindows_v5.1.5-52.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/rjpcomputing/luaforwindows/releases/download/v5.1.5-52/LuaForWindows_v5.1.5-52.exe" `
            -OutFile $luaInstaller

          $expectedHash = "c5f96e5183adea82a0f0d25ad0940c7ae50d40c542d2d7331cc887d5fddb4191"
          $actualHash = (Get-FileHash -LiteralPath $luaInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Lua installer checksum mismatch: $actualHash"
          }

          $install = Start-Process -FilePath $luaInstaller `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Lua installer failed with exit code $($install.ExitCode)."
          }

          $luaPath = "C:\Program Files (x86)\Lua\5.1"
          if (-not (Test-Path (Join-Path $luaPath "luac.exe"))) {
            throw "Lua compiler was not installed at $luaPath."
          }

          $luaPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check Code
        shell: pwsh
        run: .\make.ps1 check

      - name: Check Scripts
        shell: pwsh
        run: .\make.ps1 check-scripts

      - name: Check Mods
        shell: pwsh
        run: .\make.ps1 test

      - name: Check Windows Utility Wrapper
        shell: cmd
        run: utility.cmd cnc --check-yaml

      - name: Run Unit Tests
        shell: pwsh
        run: >-
          dotnet test OpenRA.Test\OpenRA.Test.csproj
          --configuration Debug
          --nologo
          -p:TargetPlatform=win-x64
