name: Release Packaging

on:
  push:
    tags:
      - 'release-*'
      - 'playtest-*'
      - 'devtest-*'

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_TAG: ${{ github.ref_name }}

jobs:
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Create Release If Missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${GIT_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GIT_TAG} already exists."
            exit 0
          fi

          PRERELEASE_FLAG=""
          if [[ "${GIT_TAG}" == playtest-* || "${GIT_TAG}" == devtest-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${GIT_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GIT_TAG}" \
            --draft \
            ${PRERELEASE_FLAG}

  source:
    name: Source Tarball
    needs: create-release
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Package Source
        run: |
          set -euo pipefail
          mkdir -p build/source
          ./packaging/source/buildpackage.sh "${GIT_TAG}" "${PWD}/build/source"

      - name: Upload Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${GIT_TAG}" build/source/* --clobber

  linux:
    name: Linux AppImages
    needs: create-release
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils

      - name: Package AppImages
        run: |
          set -euo pipefail
          mkdir -p build/linux
          ./packaging/linux/buildpackage.sh "${GIT_TAG}" "${PWD}/build/linux"

      - name: Upload Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${GIT_TAG}" build/linux/* --clobber

  macos:
    name: macOS Disk Image
    needs: create-release
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Package Disk Image
        env:
          MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
          MACOS_DEVELOPER_TEAM_ID: ${{ secrets.MACOS_DEVELOPER_TEAM_ID }}
          MACOS_DEVELOPER_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_USERNAME: ${{ secrets.MACOS_DEVELOPER_USERNAME }}
          MACOS_DEVELOPER_PASSWORD: ${{ secrets.MACOS_DEVELOPER_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/macos
          ./packaging/macos/buildpackage.sh "${GIT_TAG}" "${PWD}/build/macos"

      - name: Upload Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${GIT_TAG}" build/macos/* --clobber

  windows:
    name: Windows Installers
    needs: create-release
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7

      - name: Install .NET 6.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis wine64

      - name: Package Installers
        run: |
          set -euo pipefail
          mkdir -p build/windows
          ./packaging/windows/buildpackage.sh "${GIT_TAG}" "${PWD}/build/windows"

      - name: Upload Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${GIT_TAG}" build/windows/* --clobber
